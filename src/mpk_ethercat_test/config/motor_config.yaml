vendor_id: 0x0000029c
product_id: 0x03831002
assign_activate: 0x0300
auto_state_transitions: false
auto_fault_reset: false

# 0x60C2 Interpolation time period for cyclic synchronous modes
# 当前工程控制周期为 1kHz，对应 1ms = 1 * 10^-3 s
sdo:
  - {index: 0x60C2, sub_index: 1, type: int8, value: 1}   # interpolation time value
  - {index: 0x60C2, sub_index: 2, type: int8, value: -3}  # time base 10^-3 s
  - {index: 0x6081, sub_index: 0, type: uint32, value: 500} # Profile Velocity (PP mode)
  - {index: 0x6083, sub_index: 0, type: uint32, value: 5000} # Profile Acceleration (PP/PV)
  - {index: 0x6084, sub_index: 0, type: uint32, value: 5000} # Profile Deceleration (PP/PV)

rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0} # 改回了 uint16
      - {index: 0x607a, sub_index: 0, type: int32,  command_interface: position,     default: 0}
      - {index: 0x60ff, sub_index: 0, type: int32,  command_interface: velocity,     default: 0}
      - {index: 0x6060, sub_index: 0, type: int8,   command_interface: op_mode,      default: 1} # 避免上电持续写入无效模式(0)

tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word} # 改回了 uint16
      - {index: 0x6064, sub_index: 0, type: int32,  state_interface: position}
      - {index: 0x606c, sub_index: 0, type: int32,  state_interface: velocity}
      - {index: 0x6061, sub_index: 0, type: int8,   state_interface: op_mode}